plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinrok.pocketplaces'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sinrok.pocketplaces'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DPLATFORM=Android', '-DBUILD_EXAMPLES=OFF'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
        }
    }
}
