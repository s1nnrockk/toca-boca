name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PocketPlaces-Windows-x64
          path: |
            build/Release/PocketPlaces.exe
            build/PocketPlaces.exe
          if-no-files-found: error
          retention-days: 14
